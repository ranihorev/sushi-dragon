name: Ship JS Update (OTA)

# Over-the-air JavaScript publish — the `pnpm ship:update` and
# `pnpm ship:update:prod` tracks. It sends src/ to devices already on the
# chosen channel. It sends no native code: for that, use ship-ios.yml.
#
# An OTA update only reaches a device whose runtime version matches. app.json
# sets that policy to `appVersion`, so an update published here lands on the
# builds of the same app.json `version` and no others.
#
# Required repository secret:
#   EXPO_TOKEN — Expo access token (expo.dev → Account → Access tokens)
#
# It calls the eas-cli in node_modules, not one installed on the runner, for the
# reason scripts/ship.sh gives: eas.json refuses a CLI older than the version
# that works, and only the pinned one is known to be that version.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        type: choice
        default: production
        options:
          - production
          - preview
      message:
        description: Update message (optional; defaults to the git commit)
        type: string
        required: false

concurrency:
  group: ship-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # How eas-cli signs in when nobody can answer a prompt: it reads this
      # variable itself. It must be a *repository* secret — an *environment*
      # secret reads as "" unless the job declares `environment:`, and eas then
      # asks you to log in, in a place where you cannot.
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # No version here on purpose: the action reads `packageManager` from
      # package.json, so the pnpm version stays written down in one place.
      - uses: pnpm/action-setup@v6

      # pnpm must already be on the runner, or `cache: pnpm` finds no store.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # What `pnpm check` does, one step at a time so a failure names itself.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # `--auto` takes the message from the last commit and the branch from the
      # checkout. A message given by hand replaces it.
      - name: Publish the update
        run: |
          if [ -n "${{ inputs.message }}" ]; then
            ./node_modules/.bin/eas update \
              --channel "${{ inputs.channel }}" \
              --platform ios \
              --non-interactive \
              --message "${{ inputs.message }}"
          else
            ./node_modules/.bin/eas update \
              --channel "${{ inputs.channel }}" \
              --platform ios \
              --non-interactive \
              --auto
          fi
