name: test

# The same three checks `pnpm check` runs before every ship, run on each pull
# request instead. They are split into separate steps here so a failure names
# itself: types, lint, or tests. Require this check in branch protection and a
# red commit cannot reach `main`, which is the only branch the ship workflows
# build from.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No version here on purpose: the action reads `packageManager` from
      # package.json, so the pnpm version stays written down in one place.
      - uses: pnpm/action-setup@v6

      # pnpm must already be on the runner, or `cache: pnpm` finds no store.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Types first: the cheapest signal, and the one a dependency bump breaks
      # most often.
      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test
